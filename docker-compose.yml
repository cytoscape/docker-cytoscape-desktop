version: '3.10.1'
services:
  R-notebook:
    image: jupyter/datascience-notebook
    ports:
      - '8888:8888'
    environment:
      - JUPYTER_TOKEN=easy
      - PASSWORD=easy
  cytoscape-desktop:
    image: cytoscape/cytoscape-desktop:3.10.1
    ports:
      - '6080:6080'
      - '1234:1234'
      
